[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "m5-rrsi-acc-ttl"
version = "4.0.0"
description = "Official RRSI integration overlay for question-wise M5 TTL"
requires-python = ">=3.10"
dependencies = []
[project.scripts]
m5-ttl = "m5rrsi.cli:main"
[tool.setuptools.packages.find]
include = ["m5rrsi*", "integration*"]
