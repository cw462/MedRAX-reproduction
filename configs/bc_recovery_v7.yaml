# V7 recovery experiment. Flat key: value, parsed by run_bc_recovery.load_config.
experiment: bc_recovery_v7

repo: source/MedRAX
images_root: data/memory_v1/images
input: runs/v4_validation60/inputs.jsonl

# where the two memory sources live (the same pools the B/C arms used)
pool: runs/memory_pool_v3/pool.json
pool_sha256: 2eba53f789ea3c175e18c41f2a842c0a6dba4d3d5e73397e9d4174497a2e4644
skills: runs/skills_v0/skills.json
# the blocks PB/PC see are rebuilt from these logs, so they are the same treatment
b_retrieval: runs/v4_B_r1/retrieval.jsonl
c_retrieval: runs/v4_C_r1/retrieval.jsonl

# money
ledger: reports/api_budget_qwen_100cny_v9.json
inherit_ledger: reports/api_budget_qwen_100cny_v8.json
cap_cny: 1000000

# model and tools
profile: qwen3-vl-plus
classifier_checkpoint: models/home/.torchxrayvision/models_data/nih-pc-chex-mimic_ch-google-openi-kaggle-densenet121-d121-tw-lr001-rot45-tr15-sc15-seed0-best.pt
report_cache: models/hf_report
segmentation_checkpoint: models/home/.torchxrayvision/models_data/pspnet_chestxray_best_model_4.pth
model_cache: models/hf_full
temperature: 0.2
top_p: 0.95
max_output_tokens: 1024
max_case_seconds: 180
recursion_limit: 20

# budgets: P0 is the normal arm; every branch gets one verification pass
p0_tool_calls: 12
p0_model_calls: 16
branch_tool_budget: 2
branch_model_budget: 4

# held equal with the B/C arms
retrieval_top_k: 3
memory_max_chars: 1400
skill_top_k: 3
skill_max_chars: 1400
