experiment: skill_method_validation_v4
central_model: qwen3-vl-plus

# data
train_cases: 120
pilot_train_cases: 60
validation_cases: 60
prefer_unused_validation_cases: true
validation_repeats: 3
heldout_input: use_existing_505_question_input

# arms (A baseline, B strongest current, C semantic skill, D conditional branches, E step credit)
arms: [A, B, C, D, E]
extra_ablations: [C_success, C_success_failure, D_branch, D_roi, B_length_control]

# retrieval / injection, held equal across B and C
retrieval_top_k: 3
memory_max_chars: 1400
skill_top_k: 3
skill_max_chars: 1400

# tool-step credit replay
credit_states: 20
credit_branches: [do_action, skip_action]
credit_repeats: 3

# inherited from the latest real run; not the paper's protocol and not known-optimal
max_tool_calls: 12
max_model_calls: 16
recursion_limit: 40
max_case_seconds: 240
max_output_tokens: 1024
temperature: 0.2
top_p: 0.95

# policy
engineering_reaudits_as_prerequisite: false
paid_budget_policy: inherit_latest_user_authorization

# S5 heldout is deliberately disabled until the user authorises it after
# reviewing the S0-S4 results and any further strategy work.
heldout_arms: []
heldout_repeats: 0
heldout_enabled: false
